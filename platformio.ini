; waveshare-display — Waveshare ESP32-S3-Touch-LCD-4.3B helm display.
;
; Always-on LVGL client for the sensor hub (ESP-NOW, protocol v0.07).
; Sibling to sensor-display (the battery M5Paper e-paper gauge); both
; speak the same wire format via the shared protocol/ submodule.
;
;   pio run -t upload        — build + flash over USB-C
;   pio device monitor       — serial log

[env:waveshare-s3-lcd43]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP32-S3-WROOM-1-N16R8: 16 MB flash + 8 MB octal PSRAM. PSRAM is
; required — the LVGL heap and both draw buffers live there.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
    -Iinclude
    -Iprotocol            ; shared wire-format header (git submodule)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE

lib_deps =
    lvgl/lvgl@^8.3.11
    lovyan03/LovyanGFX@^1.1.16
